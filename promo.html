<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NaviGear Promo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0a0e3f;
            color: white;
            text-align: center;
        }

        h3 {
            color: #5aecff;
        }

        .slideshow {
            width: 360px;
            max-width: 100%;
            height: 220px;
            margin: auto;
            overflow: hidden;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            padding: 8px 10px 0;
            box-sizing: border-box;
        }

        .slide img {
            display: block;
            width: 100%;
            max-width: 400px;
            height: 250px;
            margin: 0 auto;
            object-fit: contain;
            border-radius: 8px;
        }

        .slide p {
            margin: 10px 0 0;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h3>Featured Gear</h3>

    <div class="slideshow">

        <div class="slide">
            <img src="images/docker/Dock1 (5).webp" width="300" alt="Docking Station">
            <p>Docking Station</p>
        </div>

        <div class="slide">
            <img src="images/dongle/Wifi2 (3).webp" width="300" alt="Wifi">
            <p>Wifi Dongle</p>
        </div>

        <div class="slide">
            <img src="images/stand/LPStand6 (5).webp" width="300" alt="Stand">
            <p>Stand</p>
        </div>

    </div>


    <script>

        let slideIndex = 0;

        function showSlides() {

            let slides = document.getElementsByClassName("slide");

            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }

            slideIndex++;

            if (slideIndex > slides.length) {
                slideIndex = 1;
            }

            slides[slideIndex - 1].style.display = "block";

            setTimeout(showSlides, 3000);
        }

        showSlides();

    </script>

</body>
</html>
